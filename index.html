<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سويقة | Souiqa</title>
  <meta name="description" content="نموذج تطبيق سويقة التفاعلي">
  <style>
    :root { --purple: #b46ee8; --dark: #2b2a5c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(160deg, #f3e8ff, #e9d5ff 50%, #d8b4fe);
      color: var(--dark);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    header { text-align: center; padding: 16px 16px 8px; }
    header h1 { font-size: 1.6rem; color: #7c3aed; }
    header p { font-size: .9rem; opacity: .8; margin-top: 4px; }
    .stage {
      flex: 1; width: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: 8px 12px 20px;
    }
    .phone {
      width: 100%; max-width: 420px;
      height: min(860px, calc(100vh - 110px));
      min-height: 560px;
      border-radius: 28px; overflow: hidden;
      background: #fff;
      box-shadow: 0 20px 50px rgba(124, 58, 237, .3);
      border: 6px solid #1f1f2e;
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    footer { padding: 0 16px 16px; font-size: .8rem; opacity: .7; text-align: center; }
    footer a { color: #7c3aed; }
    @media (max-width: 480px) {
      header { padding: 8px; }
      header p { display: none; }
      .stage { padding: 0; }
      .phone { border: 0; border-radius: 0; max-width: none; height: calc(100vh - 56px); }
      footer { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>سويقة</h1>
    <p>جرّب النموذج التفاعلي للتطبيق</p>
  </header>

  <main class="stage">
    <div class="phone">
      <iframe
        title="Souiqa prototype"
        allowfullscreen
        loading="lazy"
        src="https://embed.figma.com/proto/B8fDZ4v2WuF3nIoc8oKjwS/souiqa-ver?node-id=1-4907&page-id=0%3A1&starting-point-node-id=1%3A6606&scaling=min-zoom&content-scaling=fixed&hide-ui=1&embed-host=share">
      </iframe>
    </div>
  </main>

  <footer>
    إذا لم يظهر النموذج،
    <a href="https://www.figma.com/proto/B8fDZ4v2WuF3nIoc8oKjwS/souiqa-ver?node-id=1-4907&page-id=0%3A1&starting-point-node-id=1%3A6606&scaling=min-zoom&content-scaling=fixed" target="_blank" rel="noopener">افتحه في Figma</a>
  </footer>
</body>
</html>
